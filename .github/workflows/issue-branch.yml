# Adapted from dar's issue branch workflow.
# https://github.com/MicrobialGenomics-IrsicaixaOrg/dar/blob/27c4da214117f63469f64599c4250dfc44ba4960/.github/workflows/issue-branch.yml
name: Create Issue Branch

on:
  issues:
    types: [assigned]
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: issue-branch-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  create-issue-branch:
    if: >-
      github.event_name == 'issues' ||
      (
        !github.event.issue.pull_request &&
        contains(
          fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
          github.event.comment.author_association
        ) &&
        (
          startsWith(github.event.comment.body, '/cib') ||
          startsWith(github.event.comment.body, '/create-issue-branch')
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Create the issue branch and draft pull request
        uses: robvanderleek/create-issue-branch@1327274ffa72a698c514c5542edb05322c8e8308
        env:
          GITHUB_TOKEN: ${{ github.token }}
